<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripBot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span id="botEmoji" class="brand-emoji"></span>
        <div>
          <h1 id="botName"></h1>
          <p id="botTagline"></p>
        </div>
      </div>
      <div class="actions">
        <button id="keyBtn" class="btn" type="button">🔑 API key</button>
        <button id="newChatBtn" class="btn" type="button">New chat</button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <div id="starters" class="starters"></div>

    <form id="chatForm" class="composer">
      <textarea id="input" rows="1" placeholder="Type your message..." aria-label="Your message"></textarea>
      <button id="sendBtn" type="submit">Send</button>
    </form>
  </div>

  <!-- API key pop-up -->
  <div id="keyModal" class="modal" hidden>
    <div class="modal-card">
      <h2>Your Gemini API key</h2>
      <p>Paste your key below. It is never saved in the code.</p>
      <input id="keyInput" type="password" placeholder="Paste API key here" autocomplete="off">
      <label class="remember">
        <input id="rememberBox" type="checkbox">
        Remember on this device
      </label>
      <div class="modal-actions">
        <button id="keyCancel" class="btn-plain" type="button">Cancel</button>
        <button id="keySave" class="btn-main" type="button">Save key</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
